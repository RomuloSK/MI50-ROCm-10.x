name: Host validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host:
    name: Python and shell checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run host tests
        run: python -m pytest -q

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print0)

      - name: Check the MI50 policy contract
        run: python scripts/mi50_features.py --json --check-environment
